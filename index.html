<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Saad Traders — Admin ERP</title>
<style>
:root{
  --blue-50:#eef4ff; --blue-100:#dbe7fe; --blue-600:#2952d9; --blue-700:#1e3fae; --blue-900:#152a73;
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f8f9fc; --border:#e2e6f0;
  --text:#1b2237; --muted:#6b7280; --muted-2:#94a0b8;
  --green:#0f9d58; --green-bg:#e6f6ec; --red:#d93025; --red-bg:#fdecea; --amber:#c77700; --amber-bg:#fff4e0;
  --radius:10px; --radius-sm:6px; --shadow:0 1px 2px rgba(20,30,60,.06), 0 4px 14px rgba(20,30,60,.05);
  --sidebar-w:250px; --topbar-h:58px;
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0f1420; --surface:#161d2e; --surface-2:#1c2437; --border:#2a3350;
  --text:#e7ebf5; --muted:#9aa6c2; --muted-2:#6b7694;
  --blue-50:#182241; --blue-100:#1f2b52; --green-bg:#123322; --red-bg:#3a1a1a; --amber-bg:#3a2a10;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:var(--blue-600);text-decoration:none;}
h1,h2,h3,h4{margin:0 0 4px 0;font-weight:650;letter-spacing:-.01em;}
.hidden{display:none !important;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

/* App shell */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;transition:transform .22s ease;
}
#sidebar .brand{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);}
#sidebar .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue-600),var(--blue-900));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0;}
#sidebar .brand .txt{line-height:1.2;overflow:hidden;}
#sidebar .brand .txt b{display:block;font-size:14px;color:var(--text);white-space:nowrap;}
#sidebar .brand .txt span{font-size:11px;color:var(--muted);white-space:nowrap;}
#navList{flex:1;overflow-y:auto;padding:10px 8px;}
.nav-group-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);padding:14px 10px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--text);cursor:pointer;font-size:13.3px;font-weight:500;margin-bottom:1px;}
.nav-item:hover{background:var(--surface-2);}
.nav-item.active{background:var(--blue-600);color:#fff;}
.nav-item .ic{width:18px;text-align:center;flex-shrink:0;font-size:14px;}
#sidebarFoot{padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted-2);}

#main{flex:1;min-width:0;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-height:100vh;}
#topbar{
  height:var(--topbar-h);flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:30;
}
#menuBtn{display:none;background:none;border:1px solid var(--border);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:16px;}
#pageTitle{font-size:16px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;height:36px;padding:0 12px;cursor:pointer;font-weight:550;display:flex;align-items:center;gap:6px;}
.topbar-btn:hover{border-color:var(--blue-600);}
#content{flex:1;padding:20px;max-width:1400px;width:100%;margin:0 auto;}
#sidebarOverlay{display:none;position:fixed;inset:0;background:rgba(10,14,25,.5);z-index:35;}

/* Cards / KPI */
.grid{display:grid;gap:14px;}
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.kpi{display:flex;flex-direction:column;gap:6px;}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.kpi .val{font-size:22px;font-weight:750;letter-spacing:-.01em;}
.kpi .sub{font-size:11.5px;color:var(--muted-2);}
.kpi .icon-badge{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:4px;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px;}
.section-head:first-child{margin-top:0;}
.section-head h2{font-size:15px;}
.panel-title{font-size:15px;font-weight:650;margin-bottom:12px;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;border:1px solid transparent;line-height:1.3;white-space:nowrap;}
.btn-primary{background:var(--blue-600);color:#fff;}
.btn-primary:hover{background:var(--blue-700);}
.btn-outline{background:var(--surface);border-color:var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--blue-600);color:var(--blue-600);}
.btn-danger{background:var(--red-bg);color:var(--red);}
.btn-danger:hover{filter:brightness(.95);}
.btn-ghost{background:transparent;color:var(--muted);border:none;}
.btn-ghost:hover{color:var(--text);}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:6px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.icon-btn{width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);}
.icon-btn:hover{color:var(--blue-600);border-color:var(--blue-600);}

/* Toolbar / filters */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px;}
.toolbar .spacer{flex:1;}
.input,select.input,textarea.input{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%;}
.input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue-600);box-shadow:0 0 0 3px var(--blue-100);}
.search-box{position:relative;min-width:200px;}
.search-box input{padding-left:30px;}
.search-box .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-size:13px;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:650;}
.pill-green{background:var(--green-bg);color:var(--green);}
.pill-red{background:var(--red-bg);color:var(--red);}
.pill-amber{background:var(--amber-bg);color:var(--amber);}
.pill-gray{background:var(--surface-2);color:var(--muted);border:1px solid var(--border);}

/* Table */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow);}
table.data{width:100%;border-collapse:collapse;min-width:640px;}
table.data th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
table.data th:hover{color:var(--blue-600);}
table.data td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13.2px;white-space:nowrap;}
table.data tbody tr:hover{background:var(--surface-2);}
table.data tbody tr:last-child td{border-bottom:none;}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.tbl-actions{display:flex;gap:6px;}
.empty-state{padding:50px 20px;text-align:center;color:var(--muted);}
.empty-state .ico{font-size:32px;margin-bottom:8px;}
.pagination{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);}

/* Modal */
#modalOverlay{position:fixed;inset:0;background:rgba(10,14,25,.5);display:flex;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:30px 14px;}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:modalIn .15s ease;}
.modal.wide{max-width:820px;}
@keyframes modalIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:15.5px;}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid .full{grid-column:1/-1;}
.field label{display:block;font-size:12px;font-weight:650;color:var(--muted);margin-bottom:5px;}
.field .hint{font-size:11px;color:var(--muted-2);margin-top:3px;}
.items-table{width:100%;border-collapse:collapse;margin-top:6px;}
.items-table th{font-size:10.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 6px;}
.items-table td{padding:4px 6px;}
.items-table input,.items-table select{padding:6px 8px;}
.totals-box{margin-top:10px;background:var(--surface-2);border-radius:8px;padding:10px 14px;font-size:13px;}
.totals-box .row{display:flex;justify-content:space-between;padding:3px 0;}
.totals-box .row.grand{font-weight:750;font-size:14.5px;border-top:1px dashed var(--border);margin-top:5px;padding-top:7px;}

/* Toasts */
#toastHost{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:320px;}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--blue-600);border-radius:8px;padding:11px 14px;box-shadow:0 8px 24px rgba(0,0,0,.15);font-size:13px;font-weight:550;animation:toastIn .18s ease;}
.toast.success{border-left-color:var(--green);}
.toast.error{border-left-color:var(--red);}
.toast.warn{border-left-color:var(--amber);}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* Confirm dialog reuses modal */
.confirm-icon{width:44px;height:44px;border-radius:10px;background:var(--red-bg);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:10px;}

/* Ledger tabs */
.tabbar{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:4px;width:fit-content;margin-bottom:14px;flex-wrap:wrap;}
.tabbtn{padding:7px 13px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);}
.tabbtn.active{background:var(--surface);color:var(--blue-600);box-shadow:0 1px 2px rgba(0,0,0,.08);}

/* Login */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--blue-900),var(--blue-700));}
.login-card{background:var(--surface);border-radius:14px;padding:34px 30px;width:100%;max-width:360px;box-shadow:0 24px 60px rgba(0,0,0,.35);text-align:center;}
.login-card .mark{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--blue-600),var(--blue-900));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;margin:0 auto 14px;}

/* Print */
.print-only{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea,#printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;left:0;width:100%;padding:20px;}
  .print-only{display:block;}
}

/* Responsive */
@media (max-width:980px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  #menuBtn{display:flex;align-items:center;justify-content:center;}
  #sidebarOverlay.show{display:block;}
  .form-grid{grid-template-columns:1fr;}
  #content{padding:14px;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:520px){
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .kpi .val{font-size:18px;}
  .modal{max-width:100%;border-radius:12px 12px 0 0;margin-top:auto;}
}
.card-list{display:none;}
@media (max-width:700px){
  .table-wrap.responsive-cards table{display:none;}
  .table-wrap.responsive-cards .card-list{display:block;padding:8px;}
  .rec-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px;margin-bottom:8px;}
  .rec-card .rc-top{display:flex;justify-content:space-between;align-items:flex-start;font-weight:650;margin-bottom:6px;}
  .rec-card .rc-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:2px 0;}
  .rec-card .rc-actions{display:flex;gap:8px;margin-top:8px;}
}
</style>
</head>
<body>

<div id="loginScreen" class="hidden">
  <div class="login-card">
    <div class="mark">ST</div>
    <h2>Saad Traders</h2>
    <div style="color:var(--muted);font-size:12.5px;margin-bottom:18px;">Admin ERP — enter PIN to continue</div>
    <input id="pinInput" class="input" type="password" inputmode="numeric" placeholder="Enter PIN" style="text-align:center;letter-spacing:4px;font-size:18px;margin-bottom:10px;">
    <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="Auth.tryLogin()">Unlock</button>
    <div id="pinError" style="color:var(--red);font-size:12px;margin-top:10px;"></div>
    <div style="color:var(--muted-2);font-size:11px;margin-top:16px;">This PIN is a local screen lock only. It is not secure authentication.</div>
  </div>
</div>

<div id="app">
  <div id="sidebarOverlay" onclick="UI.closeSidebar()"></div>
  <aside id="sidebar">
    <div class="brand">
      <div class="mark">ST</div>
      <div class="txt"><b>SAAD TRADERS</b><span>Admin ERP</span></div>
    </div>
    <div id="navList"></div>
    <div id="sidebarFoot">v1.0.0 · Static ERP</div>
  </aside>

  <div id="main">
    <div id="topbar">
      <button id="menuBtn" onclick="UI.toggleSidebar()">☰</button>
      <div id="pageTitle">Dashboard</div>
      <button class="topbar-btn" onclick="UI.toggleTheme()"><span id="themeIcon">🌙</span><span id="themeLabel" style="display:none;">Theme</span></button>
      <button class="topbar-btn" onclick="Router.go('backup')">⤓ Backup</button>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="modalOverlay" class="hidden"></div>
<div id="toastHost"></div>
<div id="printArea" class="print-only"></div>

<script>
/* ============================================================
   SAAD TRADERS — ADMIN ERP
   Static single-file app. Vanilla JS. localStorage persistence.
   ============================================================ */

const APP_VERSION = "1.0.0";
const COLLECTIONS = ["products","customers","suppliers","sales","purchases","payments","receipts","expenses","stockMovements","ledgerEntries","auditLogs"];
const LS_PREFIX = "saad_";

/* ---------------- DB layer (localStorage) ---------------- */
const DB = {
  _cache:{},
  init(){
    COLLECTIONS.forEach(c=>{
      const raw = localStorage.getItem(LS_PREFIX+c);
      if(raw===null){ localStorage.setItem(LS_PREFIX+c, JSON.stringify([])); this._cache[c]=[]; }
      else {
        try{ this._cache[c] = JSON.parse(raw); if(!Array.isArray(this._cache[c])) this._cache[c]=[]; }
        catch(e){ console.warn("Corrupted collection, resetting:",c); this._cache[c]=[]; localStorage.setItem(LS_PREFIX+c, "[]"); }
      }
    });
    const s = localStorage.getItem(LS_PREFIX+"settings");
    if(s===null){ this._cache.settings = Settings.defaults(); this.saveSettings(); }
    else{
      try{ this._cache.settings = Object.assign(Settings.defaults(), JSON.parse(s)); }
      catch(e){ this._cache.settings = Settings.defaults(); }
    }
  },
  all(c){ return this._cache[c] || []; },
  save(c){ try{ localStorage.setItem(LS_PREFIX+c, JSON.stringify(this._cache[c])); return true; } catch(e){ console.error(e); Toast.show("Storage error — data may not have saved. Try exporting a backup.","error"); return false; } },
  saveSettings(){ localStorage.setItem(LS_PREFIX+"settings", JSON.stringify(this._cache.settings)); },
  get settings(){ return this._cache.settings; },
  insert(c, obj){
    if(!obj.id) obj.id = Util.uid(c);
    obj.createdAt = obj.createdAt || Util.nowISO();
    obj.updatedAt = Util.nowISO();
    this._cache[c].push(obj);
    this.save(c);
    return obj;
  },
  update(c, id, patch){
    const arr = this._cache[c];
    const idx = arr.findIndex(x=>x.id===id);
    if(idx===-1) return null;
    arr[idx] = Object.assign({}, arr[idx], patch, {updatedAt:Util.nowISO()});
    this.save(c);
    return arr[idx];
  },
  remove(c, id){
    const arr = this._cache[c];
    const idx = arr.findIndex(x=>x.id===id);
    if(idx===-1) return false;
    arr.splice(idx,1);
    this.save(c);
    return true;
  },
  find(c, id){ return (this._cache[c]||[]).find(x=>x.id===id) || null; },
  storageSizeBytes(){
    let total = 0;
    for(let key in localStorage){ if(localStorage.hasOwnProperty(key) && key.indexOf(LS_PREFIX)===0){ total += (localStorage.getItem(key)||"").length + key.length; } }
    return total;
  }
};

/* ---------------- Utilities ---------------- */
const Util = {
  _seq:{},
  uid(prefix){
    const p = (prefix||"id").slice(0,3).toUpperCase();
    const t = Date.now().toString(36).toUpperCase();
    const r = Math.random().toString(36).slice(2,6).toUpperCase();
    return `${p}-${t}${r}`;
  },
  nowISO(){ return new Date().toISOString(); },
  today(){ return new Date().toISOString().slice(0,10); },
  fmtDate(iso){
    if(!iso) return "-";
    const d = new Date(iso);
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  },
  fmtDateTime(iso){
    if(!iso) return "-";
    const d = new Date(iso);
    if(isNaN(d)) return iso;
    return d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  },
  money(n){
    n = Number(n)||0;
    const sym = (DB.settings && DB.settings.currencySymbol) || "₹";
    return sym + n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  },
  num(n,dp){ n=Number(n)||0; return n.toLocaleString('en-IN',{minimumFractionDigits:dp||0,maximumFractionDigits:dp||2}); },
  esc(s){ if(s===null||s===undefined) return ""; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  round2(n){ return Math.round((Number(n)||0)*100)/100; },
  debounce(fn, ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a), ms||250); }; },
  csvEscape(v){ v = (v===null||v===undefined)?"":String(v); if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; },
  downloadFile(filename, content, mime){
    const blob = new Blob([content], {type: mime||"application/octet-stream"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  },
  dateInRange(dateStr, from, to){
    if(!dateStr) return false;
    const d = dateStr.slice(0,10);
    if(from && d < from) return false;
    if(to && d > to) return false;
    return true;
  },
  rangeForPreset(preset){
    const now = new Date();
    const pad = n=>String(n).padStart(2,'0');
    const fmt = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    let from, to = fmt(now);
    if(preset==="today"){ from = fmt(now); }
    else if(preset==="week"){ const d=new Date(now); d.setDate(d.getDate()-d.getDay()); from=fmt(d); }
    else if(preset==="month"){ from = `${now.getFullYear()}-${pad(now.getMonth()+1)}-01`; }
    else if(preset==="year"){ from = `${now.getFullYear()}-01-01`; }
    else { from = ""; to=""; }
    return {from, to};
  }
};

/* ---------------- Toast ---------------- */
const Toast = {
  show(msg, type){
    const host = document.getElementById("toastHost");
    const el = document.createElement("div");
    el.className = "toast" + (type?(" "+type):"");
    el.textContent = msg;
    host.appendChild(el);
    setTimeout(()=>{ el.style.transition="opacity .25s"; el.style.opacity="0"; setTimeout(()=>el.remove(),260); }, 3200);
  }
};

/* ---------------- Modal ---------------- */
const Modal = {
  open(title, bodyHTML, footButtons, opts){
    opts = opts || {};
    const overlay = document.getElementById("modalOverlay");
    overlay.innerHTML = `
      <div class="modal ${opts.wide?'wide':''}" role="dialog" aria-modal="true">

/* ---------------- Business calculations ---------------- */
const Calc = {
  productStock(productId){
    const p = DB.find("products", productId);
    if(!p) return 0;
    let stock = Number(p.openingStock)||0;
    DB.all("stockMovements").forEach(m=>{
      if(m.productId!==productId) return;
      if(m.type==="in") stock += Number(m.qty)||0;
      else if(m.type==="out") stock -= Number(m.qty)||0;
    });
    return stock;
  },
  allStockLevels(){
    const map = {};
    DB.all("products").forEach(p=> map[p.id] = Number(p.openingStock)||0 );
    DB.all("stockMovements").forEach(m=>{
      if(!(m.productId in map)) map[m.productId] = 0;
      if(m.type==="in") map[m.productId]+= Number(m.qty)||0;
      else if(m.type==="out") map[m.productId]-= Number(m.qty)||0;
    });
    return map;
  },
  stockValue(){
    const levels = this.allStockLevels();
    let val = 0;
    DB.all("products").forEach(p=>{ val += (levels[p.id]||0) * (Number(p.purchasePrice)||0); });
    return val;
  },
  recordStockMovement(productId, type, qty, refType, refId, note){
    DB.insert("stockMovements", { productId, type, qty:Number(qty)||0, refType, refId, note: note||"", date: Util.nowISO() });
  },
  removeStockMovementsForRef(refType, refId){
    const arr = DB.all("stockMovements");
    const remaining = arr.filter(m=> !(m.refType===refType && m.refId===refId));
    DB._cache.stockMovements = remaining;
    DB.save("stockMovements");
  },
  saleTotals(sale){
    let subtotal = 0;
    (sale.items||[]).forEach(it=>{ subtotal += (Number(it.qty)||0) * (Number(it.rate)||0); });
    const discount = Number(sale.discount)||0;
    const afterDiscount = Math.max(0, subtotal - discount);
    const taxPct = Number(sale.taxPercent)||0;
    const tax = Util.round2(afterDiscount * taxPct/100);
    const grandTotal = Util.round2(afterDiscount + tax);
    const paid = Number(sale.paid)||0;
    const due = Util.round2(grandTotal - paid);
    return { subtotal:Util.round2(subtotal), discount, tax, grandTotal, paid, due };
  },
  customerStats(customerId){
    let totalSales=0, totalPaidAtSale=0, totalReceipts=0;
    DB.all("sales").forEach(s=>{
      if(s.customerId!==customerId) return;
      const t = this.saleTotals(s);
      totalSales += t.grandTotal;
      totalPaidAtSale += t.paid;
    });
    DB.all("receipts").forEach(r=>{ if(r.customerId===customerId) totalReceipts += Number(r.amount)||0; });
    const cust = DB.find("customers", customerId);
    const opening = cust ? (Number(cust.openingBalance)||0) : 0;
    const totalPaid = totalPaidAtSale + totalReceipts;
    const totalDue = Util.round2(opening + totalSales - totalPaid);
    let lastTx = null;
    DB.all("sales").filter(s=>s.customerId===customerId).forEach(s=>{ if(!lastTx || s.date>lastTx) lastTx=s.date; });
    DB.all("receipts").filter(r=>r.customerId===customerId).forEach(r=>{ if(!lastTx || r.date>lastTx) lastTx=r.date; });
    return { totalSales:Util.round2(totalSales), totalPaid:Util.round2(totalPaid), totalDue, lastTx };
  },
  supplierStats(supplierId){
    let totalPurchases=0, totalPaidAtPurchase=0, totalPayments=0;
    DB.all("purchases").forEach(p=>{
      if(p.supplierId!==supplierId) return;
      const t = this.purchaseTotals(p);
      totalPurchases += t.grandTotal;
      totalPaidAtPurchase += t.paid;
    });
    DB.all("payments").forEach(p=>{ if(p.partyType==="supplier" && p.partyId===supplierId) totalPayments += Number(p.amount)||0; });
    const sup = DB.find("suppliers", supplierId);
    const opening = sup ? (Number(sup.openingBalance)||0) : 0;
    const totalPaid = totalPaidAtPurchase + totalPayments;
    const totalDue = Util.round2(opening + totalPurchases - totalPaid);
    let lastTx = null;
    DB.all("purchases").filter(p=>p.supplierId===supplierId).forEach(p=>{ if(!lastTx || p.date>lastTx) lastTx=p.date; });
    DB.all("payments").filter(p=>p.partyType==="supplier"&&p.partyId===supplierId).forEach(p=>{ if(!lastTx || p.date>lastTx) lastTx=p.date; });
    return { totalPurchases:Util.round2(totalPurchases), totalPaid:Util.round2(totalPaid), totalDue, lastTx };
  },
  purchaseTotals(p){
    let subtotal = 0;
    (p.items||[]).forEach(it=>{ subtotal += (Number(it.qty)||0) * (Number(it.rate)||0); });
    const discount = Number(p.discount)||0;
    const afterDiscount = Math.max(0, subtotal - discount);
    const taxPct = Number(p.taxPercent)||0;
    const tax = Util.round2(afterDiscount * taxPct/100);
    const grandTotal = Util.round2(afterDiscount + tax);
    const paid = Number(p.paid)||0;
    const due = Util.round2(grandTotal - paid);
    return { subtotal:Util.round2(subtotal), discount, tax, grandTotal, paid, due };
  },
  totalReceivables(){
    let t=0; DB.all("customers").forEach(c=> t+= this.customerStats(c.id).totalDue); return Util.round2(t);
  },
  totalPayables(){
    let t=0; DB.all("suppliers").forEach(s=> t+= this.supplierStats(s.id).totalDue); return Util.round2(t);
  },
  cashBankBalances(){
    const opening = DB.settings.openingCash!==undefined ? Number(DB.settings.openingCash)||0 : 0;
    const openingBank = DB.settings.openingBank!==undefined ? Number(DB.settings.openingBank)||0 : 0;
    let cash = opening, bank = openingBank;
    // Sales paid amounts (at time of sale) count as cash unless method specified per-sale
    DB.all("sales").forEach(s=>{
      const paid = Number(s.paid)||0;
      if(paid>0){ if(s.paymentMethod==="bank") bank+=paid; else cash+=paid; }
    });
    DB.all("purchases").forEach(p=>{
      const paid = Number(p.paid)||0;
      if(paid>0){ if(p.paymentMethod==="bank") bank-=paid; else cash-=paid; }
    });
    DB.all("receipts").forEach(r=>{
      const amt = Number(r.amount)||0;
      if(r.method==="bank") bank+=amt; else cash+=amt;
    });
    DB.all("payments").forEach(p=>{
      const amt = Number(p.amount)||0;
      if(p.method==="bank") bank-=amt; else cash-=amt;
    });
    DB.all("expenses").forEach(e=>{
      const amt = Number(e.amount)||0;
      if(e.paymentMethod==="bank") bank-=amt; else cash-=amt;
    });
    return { cash:Util.round2(cash), bank:Util.round2(bank) };
  },
  profitAndLoss(from, to){
    let sales=0, cogs=0;
    DB.all("sales").forEach(s=>{
      if(!Util.dateInRange(s.date, from, to)) return;
      const t = this.saleTotals(s);
      sales += t.grandTotal;
      (s.items||[]).forEach(it=>{
        const prod = DB.find("products", it.productId);
        const cost = prod ? (Number(prod.purchasePrice)||0) : (Number(it.rate)*0.7||0);
        cogs += cost * (Number(it.qty)||0);
      });
    });
    const grossProfit = Util.round2(sales - cogs);
    let expenses = 0;
    DB.all("expenses").forEach(e=>{ if(Util.dateInRange(e.date, from, to)) expenses += Number(e.amount)||0; });
    const netProfit = Util.round2(grossProfit - expenses);
    return { sales:Util.round2(sales), cogs:Util.round2(cogs), grossProfit, expenses:Util.round2(expenses), netProfit };
  }
};

/* ---------------- Generic Table Component ----------------
   config: {
     id, columns:[{key,label,sortable,render(row),num}],
     rows: [...], searchKeys:[...], pageSize,
     rowActions(row) -> html, emptyMsg, cardRender(row) -> html (mobile),
     onRowClick(row)
   }
   Maintains its own state in Table.state[id]
------------------------------------------------------------- */
const Table = {
  state:{},
  render(host, config){
    const st = this.state[config.id] || { search:"", sortKey:null, sortDir:1, page:1 };
    this.state[config.id] = st;
    const pageSize = config.pageSize || 12;

    let rows = config.rows.slice();
    if(st.search){
      const q = st.search.toLowerCase();
      rows = rows.filter(r=> (config.searchKeys||[]).some(k=>{
        const v = typeof k==="function" ? k(r) : r[k];
        return v!==undefined && v!==null && String(v).toLowerCase().includes(q);
      }));
    }
    if(st.sortKey){
      rows.sort((a,b)=>{
        const col = config.columns.find(c=>c.key===st.sortKey);
        let av = col && col.sortVal ? col.sortVal(a) : a[st.sortKey];
        let bv = col && col.sortVal ? col.sortVal(b) : b[st.sortKey];
        if(typeof av==="string") av = av.toLowerCase();
        if(typeof bv==="string") bv = bv.toLowerCase();
        if(av<bv) return -1*st.sortDir;
        if(av>bv) return 1*st.sortDir;
        return 0;
      });
    }
    const total = rows.length;
    const totalPages = Math.max(1, Math.ceil(total/pageSize));
    if(st.page>totalPages) st.page = totalPages;
    const pageRows = rows.slice((st.page-1)*pageSize, st.page*pageSize);

    let toolbar = `<div class="toolbar">
      <div class="search-box"><span class="si">🔍</span><input class="input" id="tblSearch_${config.id}" placeholder="Search..." value="${Util.esc(st.search)}"></div>
      ${config.extraFilters || ""}
      <div class="spacer"></div>
      ${config.toolbarExtra || ""}
      ${config.exportCsv!==false ? `<button class="btn btn-outline btn-sm" onclick="Table.exportCsv('${config.id}')">⤓ CSV</button>` : ""}
      ${config.onAdd ? `<button class="btn btn-primary btn-sm" onclick="${config.onAdd}">+ Add ${Util.esc(config.addLabel||'')}</button>` : ""}
    </div>`;

    let thead = "<tr>" + config.columns.map(c=>{
      const arrow = st.sortKey===c.key ? (st.sortDir===1?" ▲":" ▼") : "";
      return `<th onclick="Table.sort('${config.id}','${c.key}')">${Util.esc(c.label)}${arrow}</th>`;
    }).join("") + (config.rowActions ? `<th style="text-align:right;">Actions</th>` : "") + "</tr>";

    let tbody = "";
    let cardsHTML = "";
    if(pageRows.length===0){
      tbody = `<tr><td colspan="${config.columns.length + (config.rowActions?1:0)}"><div class="empty-state"><div class="ico">📭</div>${config.emptyMsg||"No records found"}</div></td></tr>`;
      cardsHTML = `<div class="empty-state"><div class="ico">📭</div>${config.emptyMsg||"No records found"}</div>`;
    } else {
      pageRows.forEach(r=>{
        tbody += "<tr"+(config.onRowClick?` style="cursor:pointer" onclick="${config.onRowClick(r)}"`:"")+">" + config.columns.map(c=>{
          const val = c.render ? c.render(r) : Util.esc(r[c.key]);
          return `<td class="${c.num?'num':''}">${val}</td>`;
        }).join("") + (config.rowActions ? `<td class="tbl-actions" style="justify-content:flex-end;display:flex;" onclick="event.stopPropagation()">${config.rowActions(r)}</td>` : "") + "</tr>";
        if(config.cardRender) cardsHTML += config.cardRender(r);
      });
    }

    host.innerHTML = `
      ${toolbar}
      <div class="table-wrap ${config.cardRender?'responsive-cards':''}">
        <table class="data"><thead>${thead}</thead><tbody>${tbody}</tbody></table>
        <div class="card-list">${cardsHTML}</div>
        <div class="pagination">
          <span>${total} record${total!==1?'s':''}</span>
          <button class="icon-btn btn-sm" style="width:auto;padding:4px 8px;" onclick="Table.page('${config.id}',-1)" ${st.page<=1?'disabled':''}>‹ Prev</button>
          <span>Page ${st.page} / ${totalPages}</span>
          <button class="icon-btn btn-sm" style="width:auto;padding:4px 8px;" onclick="Table.page('${config.id}',1)" ${st.page>=totalPages?'disabled':''}>Next ›</button>
        </div>
      </div>
    `;
    this._configs = this._configs || {};
    this._configs[config.id] = config;

    const searchEl = document.getElementById("tblSearch_"+config.id);
    if(searchEl){
      searchEl.addEventListener("input", Util.debounce(e=>{
        st.search = e.target.value; st.page=1;
        Table.render(host, config);
        setTimeout(()=>{ const el=document.getElementById("tblSearch_"+config.id); if(el){ el.focus(); el.selectionStart=el.selectionEnd=el.value.length; } },0);
      }, 260));
    }
  },
  sort(id, key){
    const st = this.state[id];
    if(st.sortKey===key) st.sortDir *= -1; else { st.sortKey=key; st.sortDir=1; }
    Router.render();
  },
  page(id, delta){
    const st = this.state[id];
    st.page = Math.max(1, st.page+delta);
    Router.render();
  },
  exportCsv(id){
    const config = this._configs[id];
    if(!config) return;
    const rows = config.rows;
    const headers = config.columns.map(c=>c.label);
    let csv = headers.map(Util.csvEscape).join(",") + "\n";
    rows.forEach(r=>{
      csv += config.columns.map(c=>{
        const v = c.csv ? c.csv(r) : (c.render ? (c.plainText ? c.plainText(r) : r[c.key]) : r[c.key]);
        return Util.csvEscape(v);
      }).join(",") + "\n";
    });
    Util.downloadFile((config.addLabel||id)+"_export_"+Util.today()+".csv", csv, "text/csv");
    Toast.show("CSV exported successfully","success");
  }
};

  _miniList(rows, renderer, emptyMsg){
    if(!rows.length) return `<div class="card"><div class="empty-state" style="padding:24px;"><div class="ico">📭</div>${emptyMsg}</div></div>`;
    return `<div class="card" style="padding:8px;">${rows.map(renderer).join("")}</div>`;
  },
  _miniChart(){
    const days = [];
    for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
    const sales = DB.all("sales"), purchases = DB.all("purchases");
    const sVals = days.map(d=> sales.filter(s=>s.date===d).reduce((t,s)=>t+Calc.saleTotals(s).grandTotal,0));
    const pVals = days.map(d=> purchases.filter(p=>p.date===d).reduce((t,p)=>t+Calc.purchaseTotals(p).grandTotal,0));
    const max = Math.max(1, ...sVals, ...pVals);
    const barW = 34, gap = 18, chartH = 160;
    let bars = "";
    days.forEach((d,i)=>{
      const x = i*(barW*2+gap) + 10;
      const sh = Math.round((sVals[i]/max)*chartH);
      const ph = Math.round((pVals[i]/max)*chartH);
      bars += `
        <g>
          <rect x="${x}" y="${chartH-sh+20}" width="${barW}" height="${sh}" fill="var(--blue-600)" rx="3"></rect>
          <rect x="${x+barW+4}" y="${chartH-ph+20}" width="${barW}" height="${ph}" fill="#8fb0f5" rx="3"></rect>
          <text x="${x+barW}" y="${chartH+38}" font-size="10" fill="var(--muted-color,#6b7280)" text-anchor="middle">${d.slice(5)}</text>
        </g>`;
    });
    const totalW = days.length*(barW*2+gap)+10;
    return `<div style="overflow-x:auto;"><svg width="${Math.max(totalW,320)}" height="200" viewBox="0 0 ${totalW} 200">
      <style>text{fill:var(--muted-2,#94a0b8);}</style>
      ${bars}
    </svg></div>
    <div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--muted);">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--blue-600);border-radius:2px;margin-right:5px;"></span>Sales</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:#8fb0f5;border-radius:2px;margin-right:5px;"></span>Purchases</span>
    </div>`;
  },

  salesList(invoiceMode){
    return (host)=>{
      const rows = DB.all("sales").map(s=>Object.assign({}, s, {_t: Calc.saleTotals(s)}));
      const customers = DB.all("customers");
      const custMap = {}; customers.forEach(c=>custMap[c.id]=c.name);
      const statusFilter = `<select class="input" id="saleStatusSel" style="max-width:150px;"><option value="">All Status</option><option value="paid">Paid</option><option value="partial">Partial</option><option value="unpaid">Unpaid</option></select>`;
      const dateFilter = `<input class="input" type="date" id="saleFromDate" style="max-width:145px;" value="${(Table.state.sales&&Table.state.sales.from)||''}"><input class="input" type="date" id="saleToDate" style="max-width:145px;" value="${(Table.state.sales&&Table.state.sales.to)||''}">`;
      let filteredRows = rows;
      const st = Table.state.sales;
      if(st){
        if(st.status) filteredRows = filteredRows.filter(r=>{
          const paid = r._t.paid, gt = r._t.grandTotal;
          if(st.status==="paid") return paid>=gt && gt>0;
          if(st.status==="unpaid") return paid<=0;
          if(st.status==="partial") return paid>0 && paid<gt;
        });
        if(st.from||st.to) filteredRows = filteredRows.filter(r=>Util.dateInRange(r.date, st.from, st.to));
      }
      Table.render(host, {
        id:"sales", addLabel: invoiceMode?"Invoice":"Sale", onAdd:"Views.saleForm()",
        rows: filteredRows, searchKeys:["invoiceNo", r=>custMap[r.customerId]||""],
        emptyMsg: invoiceMode?"No sales invoices yet.":"No sales recorded yet. Click \"+ Add Sale\" to record your first sale.",
        extraFilters: statusFilter + dateFilter,
        columns:[
          {key:"invoiceNo", label:"Invoice #", render:r=>`<b>${Util.esc(r.invoiceNo)}</b>`},
          {key:"date", label:"Date", sortVal:r=>r.date, render:r=>Util.fmtDate(r.date)},
          {key:"customer", label:"Customer", sortVal:r=>custMap[r.customerId]||"Walk-in", render:r=>Util.esc(custMap[r.customerId]||"Walk-in")},
          {key:"grandTotal", label:"Total", num:true, sortVal:r=>r._t.grandTotal, render:r=>Util.money(r._t.grandTotal)},
          {key:"paid", label:"Paid", num:true, sortVal:r=>r._t.paid, render:r=>Util.money(r._t.paid)},
          {key:"due", label:"Due", num:true, sortVal:r=>r._t.due, render:r=>`<span style="color:${r._t.due>0.001?'var(--red)':'var(--green)'};font-weight:600;">${Util.money(r._t.due)}</span>`},
          {key:"status", label:"Status", render:r=>{
            const paid=r._t.paid, gt=r._t.grandTotal;
            if(gt<=0) return `<span class="pill pill-gray">-</span>`;
            if(paid>=gt) return `<span class="pill pill-green">Paid</span>`;
            if(paid>0) return `<span class="pill pill-amber">Partial</span>`;
            return `<span class="pill pill-red">Unpaid</span>`;
          }}
        ],
        rowActions:r=>`
          <button class="icon-btn btn-sm" title="Print Invoice" onclick="Views.printSale('${r.id}')">🖨</button>
          <button class="icon-btn btn-sm" title="Edit" onclick="Views.saleForm('${r.id}')">✎</button>
          <button class="icon-btn btn-sm" title="Delete" onclick="Views.deleteSale('${r.id}')">🗑</button>`

  _recalcSaleTotals(){
    const body = document.getElementById("saleItemsBody");
    if(!body) return;
    let subtotal = 0;
    body.querySelectorAll("tr").forEach(tr=>{
      const qty = Number(tr.querySelector(".saleItemQty").value)||0;
      const rate = Number(tr.querySelector(".saleItemRate").value)||0;
      const lt = qty*rate;
      tr.querySelector(".saleItemLineTotal").textContent = Util.money(lt);
      subtotal += lt;
    });
    const form = document.getElementById("saleFormEl");
    const discount = Number(form.discount.value)||0;
    const taxPercent = Number(form.taxPercent.value)||0;
    const afterDisc = Math.max(0, subtotal-discount);
    const tax = Util.round2(afterDisc*taxPercent/100);
    const grand = Util.round2(afterDisc+tax);
    const paid = Number(form.paid.value)||0;
    const due = Util.round2(grand-paid);
    document.getElementById("saleTotalsBox").innerHTML = `
      <div class="row"><span>Subtotal</span><span>${Util.money(subtotal)}</span></div>
      <div class="row"><span>Discount</span><span>-${Util.money(discount)}</span></div>
      <div class="row"><span>Tax (${taxPercent}%)</span><span>+${Util.money(tax)}</span></div>
      <div class="row grand"><span>Grand Total</span><span>${Util.money(grand)}</span></div>
      <div class="row"><span>Paid</span><span>${Util.money(paid)}</span></div>
      <div class="row"><span>Due</span><span style="color:${due>0.001?'var(--red)':'var(--green)'};font-weight:650;">${Util.money(due)}</span></div>
    `;
  },
  _collectSaleItems(){
    const items = [];
    document.querySelectorAll("#saleItemsBody tr").forEach(tr=>{
      const productId = tr.querySelector(".saleItemProduct").value;
      const qty = Number(tr.querySelector(".saleItemQty").value)||0;
      const rate = Number(tr.querySelector(".saleItemRate").value)||0;
      if(productId && qty>0) items.push({productId, qty, rate});
    });
    return items;
  },
  _nextDocNumber(collection, field, prefix){
    const rows = DB.all(collection);
    let max = 0;
    rows.forEach(r=>{
      const v = r[field]||"";
      const m = v.match(/(\d+)\s*$/);
      if(m) max = Math.max(max, parseInt(m[1],10));
    });
    return `${prefix}-${String(max+1).padStart(4,'0')}`;
  },
  saveSale(id){
    const form = document.getElementById("saleFormEl");
    if(!form.reportValidity()) return;
    const items = Views._collectSaleItems();
    if(items.length===0){ Toast.show("Add at least one product with quantity before saving.","error"); return; }
    for(const it of items){
      if(it.qty<=0){ Toast.show("Quantity must be greater than zero.","error"); return; }
    }
    const fd = Object.fromEntries(new FormData(form).entries());
    fd.discount = Number(fd.discount)||0;
    fd.taxPercent = Number(fd.taxPercent)||0;
    fd.paid = Number(fd.paid)||0;
    fd.items = items;

    // Stock validation: prevent negative stock unless allowed
    const levels = Calc.allStockLevels();
    const allowNegative = DB.settings.allowNegativeStock;
    if(!allowNegative){
      const deltas = {};
      if(id){
        const old = DB.find("sales", id);
        (old.items||[]).forEach(it=>{ deltas[it.productId] = (deltas[it.productId]||0) + Number(it.qty); }); // returning old stock
      }
      items.forEach(it=>{ deltas[it.productId] = (deltas[it.productId]||0) - Number(it.qty); });
      for(const pid in deltas){
        const projected = (levels[pid]||0) + deltas[pid];
        if(projected < 0){
          const prod = DB.find("products", pid);
          Toast.show(`Not enough stock for "${prod?prod.name:pid}". Enable negative stock in Settings if this is intentional.`,"error");
          return;
        }
      }
    }

    if(!id){
      const created = DB.insert("sales", fd);
      items.forEach(it=> Calc.recordStockMovement(it.productId, "out", it.qty, "sale", created.id, `Sale ${created.invoiceNo}`));
      Audit.log("Sale created","Sales", `${created.invoiceNo} — ${Util.money(Calc.saleTotals(created).grandTotal)}`);
      Toast.show("Sale saved successfully","success");
    } else {
      Calc.removeStockMovementsForRef("sale", id);
      const updated = DB.update("sales", id, fd);
      items.forEach(it=> Calc.recordStockMovement(it.productId, "out", it.qty, "sale", id, `Sale ${updated.invoiceNo}`));
      Audit.log("Sale edited","Sales", `${updated.invoiceNo}`);
      Toast.show("Sale updated successfully","success");
    }
    Modal.close(); Router.render();
  },

  savePurchase(id){
    const form = document.getElementById("purFormEl");
    if(!form.reportValidity()) return;
    const items = Views._collectPurItems();
    if(items.length===0){ Toast.show("Add at least one product with quantity before saving.","error"); return; }
    const fd = Object.fromEntries(new FormData(form).entries());
    fd.discount = Number(fd.discount)||0;
    fd.taxPercent = Number(fd.taxPercent)||0;
    fd.paid = Number(fd.paid)||0;
    fd.items = items;
    if(!id){
      const created = DB.insert("purchases", fd);
      items.forEach(it=> Calc.recordStockMovement(it.productId, "in", it.qty, "purchase", created.id, `Purchase ${created.billNo}`));
      Audit.log("Purchase created","Purchases", `${created.billNo} — ${Util.money(Calc.purchaseTotals(created).grandTotal)}`);
      Toast.show("Purchase saved successfully","success");
    } else {
      Calc.removeStockMovementsForRef("purchase", id);
      const updated = DB.update("purchases", id, fd);
      items.forEach(it=> Calc.recordStockMovement(it.productId, "in", it.qty, "purchase", id, `Purchase ${updated.billNo}`));
      Audit.log("Purchase edited","Purchases", `${updated.billNo}`);
      Toast.show("Purchase updated successfully","success");
    }
    Modal.close(); Router.render();
  },
  deletePurchase(id){
    const p = DB.find("purchases", id);
    Modal.confirm({ title:"Delete this purchase?", message:`This will permanently delete bill "${Util.esc(p.billNo)}" and reverse the stock added.`, danger:true, confirmText:"Delete",
      onConfirm:()=>{
        Calc.removeStockMovementsForRef("purchase", id);
        DB.remove("purchases", id);
        Audit.log("Purchase deleted","Purchases", p?p.billNo:id);
        Toast.show("Purchase deleted","success");
        Router.render();
      } });
  },

  /* ---------- INVENTORY ---------- */
  inventory(host){
    const levels = Calc.allStockLevels();
    const rows = DB.all("products").map(p=>Object.assign({}, p, {_stock: levels[p.id]||0}));
    host.innerHTML = `<div id="invTableHost"></div>
      <div class="section-head"><h2>Stock Movement History</h2></div>
      <div id="invMovementsHost"></div>`;
    Table.render(document.getElementById("invTableHost"), {
      id:"inventory", addLabel:"Adjustment", onAdd:"Views.stockAdjustForm()",
      rows, searchKeys:["name","sku","category"],
      emptyMsg:"No products to show inventory for.",
      columns:[
        {key:"sku", label:"SKU"},
        {key:"name", label:"Product"},
        {key:"stock", label:"Current Stock", num:true, sortVal:r=>r._stock, render:r=>Util.num(r._stock)},
        {key:"minStock", label:"Min Stock", num:true, render:r=>Util.num(r.minStock||0)},
        {key:"stockValue", label:"Stock Value", num:true, sortVal:r=>r._stock*(Number(r.purchasePrice)||0), render:r=>Util.money(r._stock*(Number(r.purchasePrice)||0))},
        {key:"status", label:"Status", render:r=>{
          if(r._stock<=0) return `<span class="pill pill-red">Out of Stock</span>`;
          if(r._stock<=(Number(r.minStock)||0)) return `<span class="pill pill-amber">Low Stock</span>`;
          return `<span class="pill pill-green">In Stock</span>`;
        }}
      ],
      rowActions:r=>`<button class="btn btn-outline btn-sm" onclick="Views.stockAdjustForm('${r.id}')">Adjust</button>`
    });
    const moves = DB.all("stockMovements").slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,100);
    Table.render(document.getElementById("invMovementsHost"), {
      id:"stockMoves", rows: moves, searchKeys:[m=>{const p=DB.find("products",m.productId); return p?p.name:"";}],
      emptyMsg:"No stock movements yet.", exportCsv:true, addLabel:"movements",
      columns:[
        {key:"date", label:"Date", render:r=>Util.fmtDateTime(r.date)},
        {key:"product", label:"Product", render:r=>{const p=DB.find("products",r.productId); return Util.esc(p?p.name:r.productId);}},
        {key:"type", label:"Type", render:r=> r.type==="in" ? `<span class="pill pill-green">Stock In</span>` : `<span class="pill pill-red">Stock Out</span>`},
        {key:"qty", label:"Qty", num:true},
        {key:"refType", label:"Source", render:r=>Util.esc(r.refType)},
        {key:"note", label:"Note", render:r=>Util.esc(r.note||"-")}
      ]
    });
  },
  stockAdjustForm(productId){
    const products = DB.all("products");
    const levels = Calc.allStockLevels();
    Modal.open("Stock Adjustment", `
      <form id="adjFormEl" class="form-grid">
        <div class="field full"><label>Product *</label>
          <select class="input" name="productId" required onchange="document.getElementById('adjCurrentStock').textContent = Util.num((Calc.allStockLevels()[this.value]||0))">
            <option value="">Select product...</option>
            ${products.map(p=>`<option value="${p.id}" ${productId===p.id?'selected':''}>${Util.esc(p.name)}</option>`).join("")}
          </select>
          <div class="hint">Current stock: <span id="adjCurrentStock">${productId?Util.num(levels[productId]||0):'-'}</span></div>
        </div>
        <div class="field"><label>Adjustment Type *</label><select class="input" name="type" required><option value="in">Stock In (increase)</option><option value="out">Stock Out (decrease)</option></select></div>
        <div class="field"><label>Quantity *</label><input class="input" type="number" min="0.001" step="0.001" name="qty" required></div>
        <div class="field full"><label>Reason / Note</label><textarea class="input" name="note" rows="2" placeholder="e.g. Damaged goods, stock count correction..."></textarea></div>
      </form>
    `, `<button class="btn btn-outline" onclick="Modal.close()">Cancel</button><button class="btn btn-primary" onclick="Views.saveStockAdjust()">Save Adjustment</button>`);
  },
  saveStockAdjust(){
    const form = document.getElementById("adjFormEl");
    if(!form.reportValidity()) return;
    const fd = Object.fromEntries(new FormData(form).entries());
    fd.qty = Number(fd.qty)||0;
    if(fd.qty<=0){ Toast.show("Quantity must be greater than zero.","error"); return; }
    if(!fd.productId){ Toast.show("Please select a product.","error"); return; }
    if(fd.type==="out" && !DB.settings.allowNegativeStock){
      const levels = Calc.allStockLevels();
      if((levels[fd.productId]||0) - fd.qty < 0){
        Toast.show("This adjustment would make stock negative. Enable negative stock in Settings if intentional.","error");
        return;
      }
    }
    Calc.recordStockMovement(fd.productId, fd.type, fd.qty, "adjustment", Util.uid("ADJ"), fd.note||"Manual adjustment");
    const p = DB.find("products", fd.productId);
    Audit.log("Stock adjustment","Inventory", `${p?p.name:fd.productId}: ${fd.type==='in'?'+':'-'}${fd.qty}`);
    Toast.show("Stock adjustment saved successfully","success");
    Modal.close(); Router.render();
  },
